.rk{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px;font-weight:700;flex-shrink:0}
.rk.t3{background:var(--accent);color:#fff}
.rk.n{background:rgba(255,255,255,.08);color:var(--dim)}
.tt{flex:1;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{font-size:12px;color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums}
.st{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;flex-shrink:0}
.st.v{background:rgba(0,161,214,.15);color:var(--bl)}
.st.s{background:rgba(108,92,231,.15);color:var(--accent)}
.fail{margin:4px 0;padding:14px;border:1px solid rgba(255,184,108,.35);border-radius:8px;color:#ffb86c;font-size:13px;line-height:1.5;background:rgba(255,184,108,.06)}
@media(max-width:768px){.g{grid-template-columns:1fr;padding:16px}.hdr{padding:16px}.tabs{padding:8px 16px;overflow-x:auto}}
</style>
