.tt{flex:1;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{font-size:12px;color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums}
.st{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;flex-shrink:0}
.st.v{background:rgba(0,161,214,.15);color:var(--bl)}

</style>
